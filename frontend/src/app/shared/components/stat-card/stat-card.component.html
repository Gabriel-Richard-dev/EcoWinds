<article class="stat-card" [class.stat-card--compact]="compact">
  <div class="stat-card__body">
    <span>{{ label }}</span>
    @if (loading) {
      <strong class="stat-skeleton"></strong>
    } @else {
      <strong>{{ value }}</strong>
    }
  </div>
  <i [class]="icon" aria-hidden="true"></i>
</article>

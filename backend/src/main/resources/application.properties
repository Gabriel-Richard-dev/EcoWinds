# Banco de Dados
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ecowinds_db}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# JWT
api.security.token.secret=${JWT_SECRET:minha_chave_secreta_super_segura_ecowinds_2026}

# CORS — use * para liberar tudo, ou separe origens por virgula
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Porta (Render injeta PORT automaticamente)
server.port=${PORT:8080}

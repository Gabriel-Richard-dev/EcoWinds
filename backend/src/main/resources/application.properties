# Banco de Dados
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ecowinds_db}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# JWT
api.security.token.secret=${JWT_SECRET:minha_chave_secreta_super_segura_ecowinds_2026}

# CORS — use * para liberar tudo, ou separe origens por virgula
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Porta (Render injeta PORT automaticamente)
server.port=${PORT:8080}

# Importacao SIGEHO
app.import.directory=${SIGEHO_IMPORT_DIR:./downloads}
app.import.archive-directory=${SIGEHO_ARCHIVE_DIR:./downloads/processed}
app.import.archive-on-success=${SIGEHO_ARCHIVE_ON_SUCCESS:true}
app.import.poll-enabled=${SIGEHO_POLL_ENABLED:true}
app.import.poll-interval-ms=${SIGEHO_POLL_INTERVAL_MS:300000}
app.import.poll-initial-delay-ms=${SIGEHO_POLL_INITIAL_DELAY_MS:15000}

# Upload multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Health check de dispositivos
app.devices.health-check-enabled=${DEVICE_HEALTH_CHECK_ENABLED:true}
app.devices.heartbeat-timeout-seconds=${DEVICE_HEARTBEAT_TIMEOUT_SECONDS:900}
app.devices.health-check-interval-ms=${DEVICE_HEALTH_CHECK_INTERVAL_MS:60000}
app.devices.health-check-initial-delay-ms=${DEVICE_HEALTH_CHECK_INITIAL_DELAY_MS:30000}

# Feriados
app.holidays.brasilapi-base-url=${BRASILAPI_BASE_URL:https://brasilapi.com.br/api}
app.holidays.timeout-seconds=${BRASILAPI_TIMEOUT_SECONDS:8}
app.holidays.refresh-enabled=${HOLIDAYS_REFRESH_ENABLED:true}
app.holidays.refresh-cron=${HOLIDAYS_REFRESH_CRON:0 15 3 * * *}
